<!doctype html>
<html lang="en">
<head>

<title>Lightkeeper</title>
<style>
/* Written for old engines (Chromium 53 on webOS 4, 79 on webOS 6): ES5, no inset, no flex gap. */
/* Before Chromium 62 there are no variable fonts: fixed weights first, then the variable
   face, which newer engines use for every weight. Each in-between weight follows a fallback. */
@font-face { font-family: Jost; src: url(jost-200.woff2) format('woff2'); font-weight: 200; }
@font-face { font-family: Jost; src: url(jost-300.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: Jost; src: url(jost-500.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Jost; src: url(jost.woff2) format('woff2'); font-weight: 100 900; }
/* The clock's other typefaces, digits only, in clock/ with their licences (OFL). */
@font-face { font-family: 'LK Classic'; src: url(clock/classic.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: 'LK Mono'; src: url(clock/mono.woff2) format('woff2'); font-weight: 200; }
@font-face { font-family: 'LK Rounded'; src: url(clock/rounded.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: 'LK Digital'; src: url(clock/digital.woff2) format('woff2'); font-weight: 300; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body {
  font-family: Jost, sans-serif; color: #f4f1ec;
  /* The picture is put on by sfondo() once loaded: none here, or the default would show first. */
  background: center / cover no-repeat #000;
  text-shadow: 0 2px 24px rgba(0, 0, 0, .5);
}
/* A new background comes in over the old one, which it gradually covers (see mettiSfondo). */
#fondu {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0;
  background: center / cover no-repeat;
}
/* The veil: dark from the top left for the time, from the bottom for the tiles.
   Its opacity is the strength set in the settings. */
#veil {
  transition: opacity .4s;
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background:
    radial-gradient(1100px 620px at 0 0, rgba(18,13,8,.92) 0, rgba(18,13,8,0) 100%),
    linear-gradient(to top, rgba(18,13,8,1) 0, rgba(18,13,8,.7) 20%, rgba(18,13,8,0) 50%);
}
header, nav, #hint { position: absolute; left: 112px; }
header { top: 68px; }
#ora { font-size: 150px; font-weight: 200; line-height: 1; letter-spacing: -.02em; }
#ora small { font-size: 52px; font-weight: 300; letter-spacing: .02em; margin-left: 14px; }
/* Other styles and sizes for the clock; without a class it is Jost 200 at 150 px, as always. */
#ora.st-classic { font-family: 'LK Classic', Jost, serif; font-weight: 300; letter-spacing: 0; -webkit-font-feature-settings: 'lnum'; font-feature-settings: 'lnum'; }

#ora.sz-small small { font-size: 40px; margin-left: 10px; }
#ora.sz-large { font-size: 200px; }
#ora.sz-large small { font-size: 68px; margin-left: 18px; }
#meteo { margin-top: 18px; height: 40px; font-size: 34px; font-weight: 300; opacity: .9; display: flex; align-items: center; }
#meteo svg { width: 34px; height: 34px; margin-left: 14px; }
nav { bottom: 104px; display: flex; align-items: flex-end; transition: -webkit-transform .2s, transform .2s; }

/* OK presses the tile in at once, before the app opens. */

  box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
/* Focus in about 120 ms, with a slight overshoot. */
nav.icons a > img { transition: transform .12s cubic-bezier(.3, 1.6, .6, 1); }
nav.icons a.sel img { -webkit-transform: scale(1.06); transform: scale(1.06); }
/* A logo, white like the words: no frame, as the brands ask, a shadow to read over the picture. */

  transition: transform .12s cubic-bezier(.3, 1.6, .6, 1);
}
/* The shadow is on the logo itself, not on the box that grows: drawn once, then only moved (measured on the C1). */
nav.icons .logo svg, nav.icons .logo img { display: block; -webkit-filter: drop-shadow(0 2px 14px rgba(0, 0, 0, .5)); filter: drop-shadow(0 2px 14px rgba(0, 0, 0, .5)); }
nav.icons .logo img, nav.icons a.sel .logo img { margin: 0; border-radius: 0; box-shadow: none; -webkit-transform: none; transform: none; }

/* A logo chosen for a tile, among app icons: on a dark tile of the icons' size. */
nav.icons .riquadro {
  display: flex; align-items: center; justify-content: center; width: 132px; height: 132px; margin: 0 auto 20px;
  border-radius: 24px; background: rgba(20, 16, 12, .86); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transition: transform .12s cubic-bezier(.3, 1.6, .6, 1);
}

nav.icons .riquadro svg, nav.icons .riquadro img { display: block; }
nav.icons .riquadro img, nav.icons a.sel .riquadro img { margin: 0; border-radius: 0; box-shadow: none; -webkit-transform: none; transform: none; }
nav.icons a.sel::after { bottom: -16px; left: 50%; margin-left: -18px; }
nav.icons a.premuto > img, nav.icons a.premuto .logo, nav.icons a.premuto .riquadro { -webkit-transform: scale(.94); transform: scale(.94); transition-duration: .06s; }
/* Names under logos and icons: only the selected one's, smaller; or none, the line under the icon alone. */
nav.icons.only-sel i { visibility: hidden; font-size: 26px; }
nav.icons.only-sel a.sel i { visibility: visible; }
nav.icons.bare i { display: none; }
nav.icons.bare .logo, nav.icons.bare img { margin-bottom: 0; }
nav.icons.bare a.gear { -webkit-align-self: center; align-self: center; }
/* The gear after the tiles opens the settings. */
nav a.gear { margin-right: 0; }
nav a.gear svg { display: block; width: 46px; height: 46px; margin-bottom: 2px; }
nav.icons a.gear svg { width: 52px; height: 52px; margin-bottom: 4px; }
/* Open apps: a button before the gear, with how many, and the panel it opens. */
nav a.gear.open { display: flex; align-items: center; margin-right: 52px; }
nav a.open b { font-size: 34px; font-weight: 300; margin-left: 12px; }
#aperte {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 120px 0 0 112px;
  background: rgba(18, 13, 8, .82);
}
#aperte[hidden] { display: none; }
body.pannello header, body.pannello nav, body.pannello #hint, body.pannello #legenda { visibility: hidden; }

/* The panel of controls: five headings across, what each offers below. */

#controllo .onglets a.sel::after { content: ""; position: absolute; left: 0; bottom: -14px; width: 36px; height: 3px; border-radius: 2px; background: currentColor; }
#controllo .righe { position: relative; width: 1300px; height: 600px; overflow: hidden; }
#controllo ul { list-style: none; }
#controllo li { display: flex; align-items: center; height: 100px; font-size: 40px; font-weight: 400; font-weight: 380; opacity: .6; cursor: pointer; transition: opacity .2s; }
#controllo li.sel { opacity: 1; font-weight: 500; font-weight: 450; }
#controllo li span { position: relative; }
#controllo li.sel span::after { content: ""; position: absolute; left: 0; bottom: -12px; width: 36px; height: 3px; border-radius: 2px; background: currentColor; }
#controllo li b { margin-left: 28px; font-size: 34px; font-weight: 300; opacity: .9; }

#controllo li .logo svg, #controllo li .logo img { display: block; }
#controllo li.assente { opacity: .35; }
#controllo p { position: absolute; left: 112px; bottom: 50px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: .8; }
/* The TV's own settings (reglages.js), in the look of the Controls panel: tabs, sub-tabs, then the list (perso.10). */
#reglages { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 110px 0 0 112px; background: rgba(18, 13, 8, .88); }
#reglages[hidden] { display: none; }
#reglages h2 { font-size: 34px; font-weight: 300; opacity: .8; margin-bottom: 30px; }
#reglages .tabs, #reglages .subs { display: flex; margin-bottom: 26px; }
#reglages .tabs a, #reglages .subs a { position: relative; margin-right: 64px; font-size: 40px; font-weight: 400; font-weight: 380; opacity: .55; transition: opacity .12s; }
#reglages .subs { margin-top: 8px; }
#reglages .subs[hidden] { display: none; }
#reglages .subs a { margin-right: 52px; font-size: 32px; }
#reglages .tabs a.sel, #reglages .subs a.sel { opacity: .8; font-weight: 500; font-weight: 450; }
#reglages .tabs a.fuoco, #reglages .subs a.fuoco { opacity: 1; }
#reglages .tabs a.fuoco::after, #reglages .subs a.fuoco::after { content: ""; position: absolute; left: 0; bottom: -14px; width: 36px; height: 3px; border-radius: 2px; background: currentColor; }
#reglages .tabs a.sel:not(.fuoco)::after, #reglages .subs a.sel:not(.fuoco)::after { content: ""; position: absolute; left: 0; bottom: -14px; width: 36px; height: 3px; border-radius: 2px; background: currentColor; opacity: .45; }
#reglages .righe { position: relative; width: 1300px; height: 600px; overflow: hidden; }
#reglages.senza-sub .righe { height: 680px; }
#reglages ul { list-style: none; transition: -webkit-transform .18s, transform .18s; }
#reglages li { display: flex; align-items: center; height: 100px; font-size: 40px; font-weight: 400; font-weight: 380; opacity: .6; transition: opacity .12s; }
#reglages li.sel { opacity: 1; font-weight: 500; font-weight: 450; }
#reglages li span { position: relative; }
#reglages li.sel span::after { content: ""; position: absolute; left: 0; bottom: -12px; width: 36px; height: 3px; border-radius: 2px; background: currentColor; }
#reglages li b { margin-left: 28px; font-size: 34px; font-weight: 300; opacity: .9; white-space: nowrap; }
#reglages li i { margin-left: 20px; font-style: normal; font-size: 30px; font-weight: 300; opacity: .6; }
#reglages li .logo { display: flex; align-items: center; justify-content: center; width: 150px; height: 84px; margin-right: 36px; -webkit-flex: none; flex: none; }
#reglages li .logo svg, #reglages li .logo img { display: block; }
#reglages li.val.sel b::before { content: "\2039\00a0\00a0"; opacity: .6; }
#reglages li.val.sel b::after { content: "\00a0\00a0\203a"; opacity: .6; }
#reglages li.apri b::after, #reglages li.azione span::after { content: none; }
#reglages li.info { opacity: .45; }
#reglages li.info.sel { opacity: .85; }
#reglages li.titolo { height: 100px; padding-top: 28px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: .55; text-transform: uppercase; letter-spacing: .08em; }
#reglages li.assente, #reglages li.spenta { opacity: .35; }
#reglages li.spenta.sel { opacity: .7; }
#reglages li.sposta { opacity: 1; }
#reglages li.sposta b { opacity: 1; font-weight: 500; }
#reglages .qr { position: absolute; right: 112px; bottom: 120px; width: 300px; text-align: center; }
#reglages .qr svg { display: block; border-radius: 16px; }
#reglages .qr p { margin-top: 18px; font-size: 24px; font-weight: 300; font-weight: 350; opacity: .8; }
#reglages .nota { position: absolute; left: 112px; bottom: 50px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: .8; }
/* The albums of the library, ticked with the remote (perso.6): all of them, or the ones ticked mixed. */
#albumi { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 120px 0 0 112px; background: rgba(18, 13, 8, .86); }
#albumi[hidden] { display: none; }
#albumi h2 { font-size: 34px; font-weight: 300; opacity: .8; margin-bottom: 28px; }
#albumi .righe { position: relative; width: 1400px; height: 780px; overflow: hidden; }
#albumi ul { list-style: none; }
#albumi li { display: flex; align-items: center; height: 104px; font-size: 44px; font-weight: 400; font-weight: 380; opacity: .6; cursor: pointer; transition: opacity .12s; }
#albumi li.sel { opacity: 1; font-weight: 500; font-weight: 450; }
#albumi li i { width: 64px; font-style: normal; -webkit-flex: none; flex: none; }
#albumi li span { position: relative; }
#albumi li.sel span::after { content: ""; position: absolute; left: 0; bottom: -14px; width: 36px; height: 3px; border-radius: 2px; background: currentColor; }
#albumi li b { margin-left: 28px; font-size: 32px; font-weight: 300; opacity: .8; }
#albumi li.cat { height: 64px; padding-left: 64px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: .55; cursor: default; text-transform: uppercase; letter-spacing: .08em; }
#albumi p { position: absolute; left: 112px; bottom: 50px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: .8; }
/* With the Magic Remote's pointer, arrows at the row's ends slide a row wider than the screen. */
.freccia {
  position: absolute; bottom: 104px; display: none; align-items: center; width: 200px;
  color: rgba(244, 241, 236, .72); cursor: pointer; transition: color .2s;
}
.freccia svg { width: 60px; height: 60px; -webkit-filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .6)); filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .6)); }
.freccia:hover { color: #f4f1ec; }
/* The row fades under each arrow, which says there is more that way. */
#fr-sx { left: 0; padding-left: 28px; justify-content: flex-start; background: radial-gradient(farthest-side at 0 50%, rgba(18, 13, 8, .9), rgba(18, 13, 8, 0)); }
#fr-dx { right: 0; padding-right: 28px; justify-content: flex-end; background: radial-gradient(farthest-side at 100% 50%, rgba(18, 13, 8, .9), rgba(18, 13, 8, 0)); }
body.puntatore .freccia.su { display: flex; }
body.pannello .freccia { visibility: hidden; }
/*
 * The painting's caption, in the corner opposite the clock, as big as the weather line and readable over a pale
 * painting as over a dark one: behind the words a dark patch that fades out at its edges, as the captions of
 * Apple TV have. A plain gradient, drawn once: no blurred shadow to work out at every frame. The title is a
 * little bolder than the artist and the year.
 */
#legenda {
  position: absolute; top: 74px; right: 112px; max-width: 900px; padding: 4px 0; text-align: right; font-size: 34px; font-weight: 300; font-weight: 350;
  line-height: 1.25; letter-spacing: .01em; opacity: .92; color: #fff; transition: opacity .4s;
  text-shadow: 0 1px 0 rgba(0, 0, 0, .55);
}
#legenda::before {
  content: ""; position: absolute; z-index: -1; top: -110px; right: -170px; bottom: -110px; left: -230px;
  background: radial-gradient(closest-side, rgba(18, 13, 8, .5), rgba(18, 13, 8, .44) 45%, rgba(18, 13, 8, .2) 75%, rgba(18, 13, 8, 0));
}
#legenda b { font-weight: 500; font-weight: 520; }
#legenda:empty { display: none; }
/*
 * The painting alone, after a while without a key: the time, the weather, the tiles and the shade give way,
 * and the picture, on a layer of its own, drifts very slowly (zoom and pan, in a direction chosen at each
 * start), so that no pixel stays lit by the same thing for long. The caption shows for the first forty
 * seconds of every five minutes, at the foot of the picture. Any key or the pointer ends it.
 */
#arte {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; visibility: hidden;
  background: center / cover no-repeat #000; transition: opacity .4s, visibility 0s .4s;
}
#arte.kb0 { -webkit-animation: kb0 140s ease-in-out infinite alternate; animation: kb0 140s ease-in-out infinite alternate; }
#arte.kb1 { -webkit-animation: kb1 140s ease-in-out infinite alternate; animation: kb1 140s ease-in-out infinite alternate; }
@-webkit-keyframes kb0 { from { -webkit-transform: scale(1.02) translate(1.5%, 1%); } to { -webkit-transform: scale(1.16) translate(-2%, -1.5%); } }
@keyframes kb0 { from { transform: scale(1.02) translate(1.5%, 1%); } to { transform: scale(1.16) translate(-2%, -1.5%); } }
@-webkit-keyframes kb1 { from { -webkit-transform: scale(1.16) translate(2%, -1.5%); } to { -webkit-transform: scale(1.02) translate(-1.5%, 1%); } }
@keyframes kb1 { from { transform: scale(1.16) translate(2%, -1.5%); } to { transform: scale(1.02) translate(-1.5%, 1%); } }
@-webkit-keyframes leg { 0% { opacity: 0; } 1% { opacity: .92; } 13% { opacity: .92; } 14%, 100% { opacity: 0; } }
@keyframes leg { 0% { opacity: 0; } 1% { opacity: .92; } 13% { opacity: .92; } 14%, 100% { opacity: 0; } }
body.arte #arte { opacity: 1; visibility: visible; transition: opacity 2s; }
body.arte #veil { opacity: 0 !important; transition: opacity 2s; }
body.arte header, body.arte nav, body.arte #hint, body.arte .freccia { opacity: 0; transition: opacity 2s; }
body.arte #legenda {
  top: auto; right: auto; left: 112px; bottom: 76px; max-width: 1300px; text-align: left; font-size: 40px; opacity: 0;
  -webkit-animation: leg 300s linear infinite; animation: leg 300s linear infinite;
}
header { transition: opacity .4s; }
#hint {
  bottom: 50px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: 0; transition: opacity .2s;
  white-space: nowrap;
}
#hint.on { opacity: .8; }
</style>
</head>

<script>

var EXEC = 'luna://org.webosbrew.hbchannel.service/exec';

var porta = 8090;

// This page's own directory, which holds the server under service/.
var APP_DIR = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));

var TEXT = { settings: 'Settings', phone: 'or on your phone: ', empty: 'Choose your tiles in Settings',

    // The next ones are made ready once this fade is over.
    setTimeout(preparaProssimi, 2500);
  });
}

/*
 * Pictures loaded and decoded before they show, by address: the one on the screen, the one asked for, and the
 * next ones (preparaProssimi), so that a fade starts on its first frame instead of waiting for the decoding.
 * The others are let go.
 */
var pronte = {};
function prepara(url, cb) {
  var p = pronte[url];
  if (!p) {
    p = pronte[url] = { img: new Image(), fatto: false, ok: false, attesa: [] };
    var fine = function (ok) {
      if (p.fatto) return;
      p.fatto = true;
      p.ok = ok;
      if (!ok && pronte[url] === p) delete pronte[url]; // asked again next time
      var a = p.attesa;
      p.attesa = [];
      a.forEach(function (f) { f(ok); });
    };
    p.img.onload = function () {
      if (p.img.decode) p.img.decode().then(function () { fine(true); }, function () { fine(true); });
      else fine(true);
    };
    p.img.onerror = function () { fine(false); };
    p.img.src = url;
  }
  if (!cb) return;
  if (p.fatto) cb(p.ok);
  else p.attesa.push(cb);
}

/*
 * The next pictures, by the time of day: the one "next background" goes to, and in the last ten minutes of a
 * slot the first one of the next slot. Called after each change and every minute.
 */
function preparaProssimi() {
  var tieni = {}, adesso = new Date();
  tieni[sfondoMesso] = tieni[sfondoChiesto] = true;
  if (cfg.backgroundMode === 'library' && cfg.libraryNow && cfg.libraryNow.next) tieni[urlLib(cfg.libraryNow.next)] = true;
  if (cfg.backgroundMode === 'time') {
    var ora = fondoDelMomento(cfg, adesso, 0);
    if (ora.pool.length > 1) tieni[urlFondo(fondoDelMomento(cfg, adesso, passoFondo(ora.chiave) + 1).id)] = true;
    var dopo = new Date(adesso.getTime() + 10 * 60000);
    if (fasciaDi(dopo.getHours(), cfg.timeSlots) !== ora.fascia) {
      dopo.setMinutes(0, 0, 0);
      var poi = fondoDelMomento(cfg, dopo, 0);
      if (poi.id) tieni[urlFondo(poi.id)] = true;
    }
  }
  Object.keys(pronte).forEach(function (u) { if (!tieni[u] && pronte[u].fatto) delete pronte[u]; });
  Object.keys(tieni).forEach(function (u) { if (u) prepara(u); });
}

/*
 * The picture, ready, goes on the body: the first one at once, each after it over the old
 * one, which it gradually covers in under two seconds. The body takes it when that is done.
 * Only the opacity changes: the start of the fade is drawn two frames before it, without
 * asking the engine for a layout.
 */
function mettiSfondo(url, prima) {
  var corpo = document.body.style, f = fondu.style;
  // Another change while one is under way: the one coming in goes on the body.
  if (inArrivo) { clearTimeout(dissolvenza); dissolvenza = null; corpo.backgroundImage = 'url(' + inArrivo + ')'; inArrivo = ''; }
  f.webkitTransition = f.transition = 'none';
  f.opacity = 0;
  if (!prima) { corpo.backgroundImage = 'url(' + url + ')'; return; }
  f.backgroundImage = 'url(' + url + ')';
  inArrivo = url;
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      if (inArrivo !== url) return;
      f.webkitTransition = f.transition = 'opacity 1.6s ease';
      f.opacity = 1;
      dissolvenza = setTimeout(function () {
        dissolvenza = null;
        inArrivo = '';
        corpo.backgroundImage = 'url(' + url + ')';
        f.webkitTransition = f.transition = 'none';
        f.opacity = 0;
      }, 1700);
    });
  });
}

/*
 * The background by the time of day: the pictures ticked for the slot the TV's clock is in,
 * one of them drawn for each slot of each day (fondi.js), and moved on by "next background".
 * Nothing ticked for the slot: the one on the screen stays; with none yet, the one chosen
 * for the fixed background. The steps taken keep until the slot changes.
 */
function passoFondo(chiave, nuovo) {
  var p = null;
  try { p = JSON.parse(localStorage.getItem('fondoPasso')); } catch (e) {}
  if (nuovo !== undefined) {
    p = { key: chiave, step: nuovo };
    try { localStorage.setItem('fondoPasso', JSON.stringify(p)); } catch (e) {}
  }
  return p && p.key === chiave ? p.step : 0;
}

/*
 * The pictures kept on the TV for when the library cannot be reached: the one ticked for this time of day among
 * them (their slots in the settings), else the fixed one.
 */
function soccorso() {
  var ora = fondoDelMomento(cfg, new Date(), 0);
  return ora.id ? urlFondo(ora.id) : urlFissa();
}

// A picture of the library, through the server on this TV, which keeps it in its cache.
function urlLib(id) { return server() + '/lib/' + id + '.jpg'; }
var didascalie = {}; // the captions of the library's pictures seen, by id

function urlFondo(id) {
  return /^my-/.test(id) ? server() + '/mine/' + id + '.jpg?s=' + (cfg.started || 0) : 'backgrounds/' + id + '.jpg';
}

// The check of the slot, which the Home makes every minute, at power on and on coming back.
function fondoDellOra() {
  if (cfg.backgroundMode !== 'time') return;
  var adesso = new Date(), ora = fondoDelMomento(cfg, adesso, 0);
  if (ora.id) ora = fondoDelMomento(cfg, adesso, passoFondo(ora.chiave));
  if (ora.id) return sfondo(urlFondo(ora.id));
  if (!sfondoMesso && !sfondoChiesto) sfondo(urlFissa()); // nothing to keep yet
}

// The fixed choice, or the random one the server drew.
function urlFissa() {
  var bg = /^[a-z0-9-]+$/.test(cfg.backgroundNow || '') ? cfg.backgroundNow :
    cfg.background && cfg.background.custom ? 'custom' : /^[a-z0-9-]+$/.test(cfg.preset || '') ? cfg.preset : 'godrevy';
  // A picture uploaded, picked at random, comes from the server under its own id.
  return bg === 'custom' ? server() + '/background.jpg?rev=' + cfg.background.rev + '&s=' + (cfg.started || 0) :
    urlFondo(bg);
}

// A line at the foot of the Home for a few seconds.
var avvisoTimer = null;
function avviso(testo) {
  hint.textContent = testo;
  hint.className = 'on';
  clearTimeout(avvisoTimer);
  avvisoTimer = setTimeout(function () { seleziona(sel, true); }, 3000);
}

/*
 * "Next background", from its tile or its colour key: by the time of day, the next of the
 * pictures for this slot; at random, the next of those ticked, which the server keeps until
 * the TV goes off; with a fixed background there is nothing to go through.
 */
function fondoSuccessivo() {
  if (cfg.backgroundMode === 'time') {
    var ora = fondoDelMomento(cfg, new Date(), 0);
    if (ora.pool.length < 2) return avviso(TEXT.oneBg);
    passoFondo(ora.chiave, passoFondo(ora.chiave) + 1);
    return fondoDellOra();
  }
  if (cfg.backgroundMode !== 'random' && cfg.backgroundMode !== 'library') return avviso(TEXT.fixedBg);
  if (cfg.backgroundMode === 'library' && cfg.libraryNow && !cfg.libraryNow.next) return avviso(TEXT.oneLib);
  var x = new XMLHttpRequest();
  x.open('POST', server() + '/api/background/next');
  x.setRequestHeader('Content-Type', 'application/json');
  x.timeout = 5000;
  x.onload = function () {
    if (x.status === 409) return avviso(cfg.backgroundMode === 'library' ? TEXT.oneLib : TEXT.fewBg);
    leggi(); // the new one comes with the config
  };
  x.send('{}');
}

function disegna() {
  ora.className = classeOra(cfg);
  // Names only; logos, or the TV's icon where an app has none; the TV's icons. Inputs show their device.
  var modo = cfg.tileStyle === 'logo' || cfg.tileStyle === 'icon' ? cfg.tileStyle : 'text';
  nav.className = modo === 'text' ? '' : 'icons' + (cfg.labels === 'none' ? ' bare' : cfg.labels === 'selected' ? ' only-sel' : '');
  nav.innerHTML = '';
  spostamento = 0;
  caricatori = [];
  misura = null;
  selMostrata = -1;
  voci = (cfg.tiles || []).filter(function (t) { return !t.hidden; }); // hidden from the TV's own settings
  if (cfg.openApps) voci.push({ aperte: true });
  // Without tiles the gear stays, as the Home would have nothing to choose.
  if (!cfg.hideGear || !voci.length) voci.push({ gear: true }); // all hidden: the gear stays, for the settings
  voci.forEach(function (v, i) {
    var a = document.createElement('a');
    if (v.gear) {
      a.innerHTML = GEAR;
      a.setAttribute('aria-label', TEXT.settings);
    } else if (v.aperte) {
      a.innerHTML = CARDS + (aperte.length ? '<b>' + aperte.length + '</b>' : ''); // no 0
      a.setAttribute('aria-label', quanteAperte());
    } else {
      if (modo !== 'text') {
        var box = document.createElement('div');
        box.className = 'logo';
        a.appendChild(box);
        caricatori[i] = riempi(box, v, modo);
      }
      // The name stays for screen readers when it is not shown.
      a.setAttribute('aria-label', v.title);
      var label = document.createElement('i');
      label.textContent = v.title;
      a.appendChild(label);
    }
    a.onmouseover = function () { seleziona(i, true); };
    a.onclick = function () { lancia(i); };
    nav.appendChild(a);
  });
  veil.style.opacity = (typeof cfg.veil === 'number' ? cfg.veil : 80) / 100;
  // An uploaded picture comes from the server; the app's own backgrounds are beside this page.
  // With the server's start in the address: a picture that failed while it was down is asked again.
  // With a random background, the one the server picked for this time the TV is on.
  var url = urlFissa();
  // The random one kept from last time is not shown before the server's answer, for a moment at most.
  if (cfg.libraryNow && cfg.libraryNow.captions) for (var cid in cfg.libraryNow.captions) didascalie[cid] = cfg.libraryNow.captions[cid];
  if (cfg.backgroundMode === 'library' && cfg.libraryNow) sfondo(urlLib(cfg.libraryNow.id));
  else if (cfg.backgroundMode === 'library' && !letto) setTimeout(function () { if (!letto) sfondo(soccorso()); }, 800);
  else if (cfg.backgroundMode === 'library') sfondo(soccorso());
  else if (cfg.backgroundMode === 'time') fondoDellOra();
  else if (cfg.randomBackground && !letto) setTimeout(function () { if (!letto) sfondo(url); }, 800);
  else sfondo(url);
  seleziona(iniziale());
  aggiorna();
  legenda();
}

document.addEventListener('keydown', function (e) {
  // The arrows put the Magic Remote in its five-way mode, without the pointer; webOS 1 says so with keys.
  if (e.keyCode >= 37 && e.keyCode <= 40 || e.keyCode === 1537) conPuntatore(false);
  if (e.keyCode === 1536) conPuntatore(true);
  if (!pannello.hidden) return tastoPannello(e);
  if (!controllo.hidden) return tastoControllo(e);
  if (!albumi.hidden) return tastoAlbum(e);
  if (!reglages.hidden) return tastoReglages(e);
  if (cfg.collectionsKey && TOUCHES[cfg.collectionsKey] === e.keyCode && cfg.backgroundMode === 'library') { if (!e.repeat) apriAlbum(); }
  else if (cfg.nextBgKey && TOUCHES[cfg.nextBgKey] === e.keyCode) tastoColore(e);
  else if (e.keyCode === 37) seleziona(sel - 1);
  else if (e.keyCode === 39) seleziona(sel + 1);
  else if (e.keyCode === 13) { premi(sel); lancia(sel); }
  else if (e.keyCode === 40) apri(LG_HOME); // Down: LG's Home
  else if (e.keyCode === 461 && sistema) sistema.platformBack(); // Back
  else return;
  e.preventDefault();
});

/*
 * Open apps, which the server reads from the TV and closes: the button shows when it
 * is on in the settings, with how many when there are some; its panel lists them,
 * then Close all, or says there are none. OK closes, Back returns.
 */
var pannello = document.getElementById('aperte');
var righe = pannello.querySelector('.righe'), lista = pannello.querySelector('ul');
var selP = 0, chiudendo = false, aperteLette = false;
pannello.querySelector('h2').textContent = TEXT.openTitle;
pannello.onclick = function (e) { if (e.target === pannello) chiudiPannello(); };

function quanteAperte() { return !aperte.length ? TEXT.none : aperte.length === 1 ? TEXT.open1 : aperte.length + TEXT.openN; }
// The button, or the gear when there is none.
function ultimaVoce() { for (var k = voci.length - 1; k >= 0; k--) if (voci[k].aperte) return k; return voci.length - 1; }

function chiediAperte() {
  // Off in the settings: the TV is not asked.
  if (!cfg.openApps) { aperteLette = true; return mettiAperte([]); }
  var x = new XMLHttpRequest();
  x.open('GET', server() + '/api/open');
  x.timeout = 5000;
  x.onload = function () {
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) {}
    if (r && r.apps) { aperteLette = true; mettiAperte(r.apps); }
  };
  x.send();
}

function mettiAperte(nuove, restaInFondo) {
  var prima = JSON.stringify(aperte);
  aperte = nuove;
  if (JSON.stringify(aperte) !== prima) disegna();
  if (restaInFondo) seleziona(ultimaVoce());
  if (!cfg.openApps && !pannello.hidden) chiudiPannello();
}

// The tile an open app has, for its name and the logo chosen for it.
function tesseraDi(id) {
  var t = null;
  (cfg.tiles || []).forEach(function (v) { if (v.id === id && !t) t = v; });
  return t;
}

function disegnaPannello() {
  var modo = cfg.tileStyle === 'logo' ? 'logo' : 'icon';
  lista.innerHTML = '';
  aperte.concat([{ tutte: true }]).forEach(function (v, i) {
    var li = document.createElement('li'), nome = document.createElement('span');
    if (v.tutte) {
      nome.textContent = aperte.length ? TEXT.closeAll : TEXT.none;
    } else {
      var t = tesseraDi(v.id) || v, box = document.createElement('div');
      box.className = 'logo';
      li.appendChild(box);
      nome.textContent = t.title;
      riempi(box, { id: v.id, title: t.title, logo: t.logo }, modo)();
    }
    li.appendChild(nome);
    li.onmouseover = function () { selezionaP(i); };
    li.onclick = function () { premiP(i); };
    lista.appendChild(li);
  });
  selezionaP(Math.min(selP, aperte.length));
  pannello.querySelector('p').textContent = aperte.length ? TEXT.openNote : TEXT.openNoteEmpty;
}

function selezionaP(i) {
  selP = i;
  for (var k = 0; k < lista.children.length; k++) {
    lista.children[k].className = (k === i ? 'sel' : '') + (k < aperte.length ? '' : aperte.length ? ' tutte' : ' vuota');
  }
  var li = lista.children[i];
  if (li.offsetTop < righe.scrollTop) righe.scrollTop = li.offsetTop;
  if (li.offsetTop + li.offsetHeight > righe.scrollTop + righe.clientHeight) righe.scrollTop = li.offsetTop + li.offsetHeight - righe.clientHeight;
}

function premiP(i) {
  if (!aperte.length) return chiudiPannello(); // No open apps: OK goes back too
  if (chiudendo) return;
  chiudendo = true;
  for (var k = 0; k < aperte.length; k++) if (k === i || i === aperte.length) lista.children[k].className += ' via';
  var x = new XMLHttpRequest();
  x.open('POST', server() + '/api/close');
  x.setRequestHeader('Content-Type', 'application/json');
  x.timeout = 30000;
  x.onload = x.onerror = x.ontimeout = function () {
    chiudendo = false;
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) {}
    if (r && r.apps) mettiAperte(r.apps, true);
    if (!aperte.length) return chiudiPannello();
    disegnaPannello();
  };
  x.send(JSON.stringify(i === aperte.length ? { all: true } : { id: aperte[i].id }));
}

function apriPannello() {
  selP = 0;
  pannello.hidden = false;
  document.body.classList.add('pannello');
  disegnaPannello();
}

function chiudiPannello() {
  pannello.hidden = true;
  document.body.classList.remove('pannello');
  seleziona(ultimaVoce());
}

function tastoPannello(e) {
  if (e.keyCode === 38) selezionaP(Math.max(0, selP - 1));
  else if (e.keyCode === 40) selezionaP(Math.min(aperte.length, selP + 1));
  else if (e.keyCode === 13) premiP(selP);
  else if (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8) chiudiPannello();
  else if (e.keyCode !== 37 && e.keyCode !== 39) return;
  e.preventDefault();
}

/*
 * The collections of the library, from the tile "Collections" or a long press of the next background's key:
 * "All backgrounds", then the collections under their category (Artists, Periods…) with how many pictures; OK
 * ticks or unticks one (several are mixed, as the settings say), Back closes. Saved at once by the server, which
 * moves on to a picture of the collections ticked. Category lines are passed over by up and down.
 */
var albumi = document.getElementById('albumi');
var alRighe = albumi.querySelector('.righe'), alLista = albumi.querySelector('ul'), selA = 0;
albumi.querySelector('h2').textContent = TEXT.albums;
albumi.onclick = function (e) { if (e.target === albumi) chiudiAlbum(); };
function voceAlbum() {
  var out = [{ tutti: true }], cat = null;
  (cfg.libraryCollectionList || []).forEach(function (c) {
    if (c.cat !== cat) { cat = c.cat; out.push({ titolo: cat }); }
    out.push(c);
  });
  return out;
}
function apriAlbum() {
  selA = 0;
  albumi.hidden = false;
  document.body.classList.add('pannello');
  disegnaAlbum();
}
function chiudiAlbum() {
  albumi.hidden = true;
  document.body.classList.remove('pannello');
  if (tornaReglages()) return;
  seleziona(sel, true);
}
function disegnaAlbum() {
  var scelti = cfg.libraryCollections || [], lista = voceAlbum();
  alLista.innerHTML = '';
  if (lista.length < 2) {
    var vuoto = document.createElement('li'), nv = document.createElement('span');
    nv.textContent = TEXT.noAlbums;
    vuoto.appendChild(nv);
    alLista.appendChild(vuoto);
  }
  else lista.forEach(function (a, i) {
    var li = document.createElement('li');
    if (a.titolo) { li.className = 'cat'; li.textContent = a.titolo; alLista.appendChild(li); return; }
    var segno = document.createElement('i'), nome = document.createElement('span');
    segno.textContent = (a.tutti ? !scelti.length : scelti.indexOf(a.id) !== -1) ? '\u2713' : '';
    nome.textContent = a.tutti ? TEXT.allAlbums : a.name;
    li.appendChild(segno);
    li.appendChild(nome);
    if (!a.tutti) { var n = document.createElement('b'); n.textContent = String(a.count); li.appendChild(n); }
    li.onmouseover = function () { selezionaAlbum(i); };
    li.onclick = function () { selezionaAlbum(i); premiAlbum(i); };
    alLista.appendChild(li);
  });
  albumi.querySelector('p').textContent = lista.length < 2 ? '' : TEXT.albumsNote;
  selezionaAlbum(Math.min(selA, alLista.children.length - 1));
}
function selezionaAlbum(i) {
  selA = i;
  for (var k = 0; k < alLista.children.length; k++) if (alLista.children[k].className !== 'cat') alLista.children[k].className = k === i ? 'sel' : '';
  var li = alLista.children[i];
  if (!li) return;
  // A category line above the first of its collections shows with it.
  var top = li.previousSibling && li.previousSibling.className === 'cat' ? li.previousSibling.offsetTop : li.offsetTop;
  if (top < alRighe.scrollTop) alRighe.scrollTop = top;
  if (li.offsetTop + li.offsetHeight > alRighe.scrollTop + alRighe.clientHeight) alRighe.scrollTop = li.offsetTop + li.offsetHeight - alRighe.clientHeight;
}
// Up or down to the next line that is a choice, over the category lines.
function passoAlbum(d) {
  var lista = voceAlbum(), i = selA + d;
  while (i >= 0 && i < lista.length && lista[i].titolo) i += d;
  if (i >= 0 && i < lista.length) selezionaAlbum(i);
}
function premiAlbum(i) {
  var lista = voceAlbum(), a = lista[i], scelti = (cfg.libraryCollections || []).slice();
  if (!a) return chiudiAlbum();
  if (a.titolo) return;
  if (a.tutti) scelti = [];
  else if (scelti.indexOf(a.id) !== -1) scelti.splice(scelti.indexOf(a.id), 1);
  else scelti.push(a.id);
  cfg.libraryCollections = scelti;
  disegnaAlbum();
  var x = new XMLHttpRequest();
  x.open('POST', server() + '/api/library/collections');
  x.setRequestHeader('Content-Type', 'application/json');
  x.timeout = 5000;
  x.onload = function () { leggi(); };
  x.send(JSON.stringify({ collections: scelti }));
}
function tastoAlbum(e) {
  if (e.keyCode === 38) passoAlbum(-1);
  else if (e.keyCode === 40) passoAlbum(1);
  else if (e.keyCode === 13) premiAlbum(selA);
  else if (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8) chiudiAlbum();
  // The collections' key again closes them; the next background's key goes on with the ones ticked.
  else if (cfg.collectionsKey && TOUCHES[cfg.collectionsKey] === e.keyCode) { if (!e.repeat) chiudiAlbum(); }
  else if (cfg.nextBgKey && TOUCHES[cfg.nextBgKey] === e.keyCode) { if (!e.repeat) { chiudiAlbum(); fondoSuccessivo(); } }
  else if (e.keyCode !== 37 && e.keyCode !== 39) return;
  e.preventDefault();
}

/*
 * The next background's key: with the library, a short press moves on (on release), a long one (the remote
 * repeating the key) opens the collections. Without a release or a repeat, it moves on after 0.6 s.
 */
var coloreTimer = null;
// The last keys the Home got (code, down or up, repeated, ms), to see from the web inspector what a remote sends.
var tastiVisti = [], tastiInizio = Date.now();
['keydown', 'keyup'].forEach(function (n) {
  document.addEventListener(n, function (e) {
    tastiVisti.push([n === 'keydown' ? 'd' : 'u', e.keyCode, e.repeat ? 1 : 0, Date.now() - tastiInizio]);
    if (tastiVisti.length > 40) tastiVisti.shift();
  }, true);
});
function tastoColore(e) {
  if (cfg.backgroundMode !== 'library') return fondoSuccessivo();
  if (e.repeat) {
    if (coloreTimer) { clearTimeout(coloreTimer); coloreTimer = null; apriAlbum(); }
    return;
  }
  clearTimeout(coloreTimer);
  coloreTimer = setTimeout(function () { coloreTimer = null; fondoSuccessivo(); }, 600);
}
document.addEventListener('keyup', function (e) {
  if (!coloreTimer || !cfg.nextBgKey || TOUCHES[cfg.nextBgKey] !== e.keyCode) return;
  clearTimeout(coloreTimer);
  coloreTimer = null;
  fondoSuccessivo();
});

/*
 * The caption of the painting on the screen: "Artist — Title, year" from the config's bgInfo, when the
 * captions are on in the settings and the picture has some.
 */
var legendaEl = document.getElementById('legenda');
function idFondo(url) {
  var m = /\/mine\/(my-[0-9a-f]{8})\.jpg/.exec(url) || /\/lib\/([0-9a-f]{16})\.jpg/.exec(url) || /(?:^|\/)backgrounds\/([a-z0-9-]+)\.jpg/.exec(url);
  if (m) return m[1];
  return /\/background\.jpg/.test(url) && cfg.background && cfg.background.id ? cfg.background.id : null;
}

function legenda() {
  var id = sfondoMesso ? idFondo(sfondoMesso) : null;
  var i = !cfg.captions || !id ? null : /^[0-9a-f]{16}$/.test(id) ? didascalie[id] : cfg.bgInfo ? cfg.bgInfo[id] : null;
  legendaEl.textContent = '';
  if (!i || !(i.artist || i.title)) return;
  // A photo, with its place: "Title, place — author, year".
  if (i.place) {
    var bp = document.createElement('b');
    bp.textContent = i.title || i.place;
    legendaEl.appendChild(bp);
    legendaEl.appendChild(document.createTextNode((i.title ? ', ' + i.place : '') + (i.artist ? ' \u2014 ' + i.artist : '') + (i.year ? ', ' + i.year : '')));
    return;
  }
  // "Artist — Title, year", the title bolder.
  if (i.artist) legendaEl.appendChild(document.createTextNode(i.artist + (i.title ? ' \u2014 ' : '')));
  if (i.title) { var b = document.createElement('b'); b.textContent = i.title; legendaEl.appendChild(b); }
  if (i.year) legendaEl.appendChild(document.createTextNode(', ' + i.year));
}

/*
 * The painting alone after idleMinutes without a key (or the pointer) on the Home, with the layer that drifts
 * slowly; any key or the pointer ends it, and is not passed on, so it opens nothing. Not while another app is
 * in front, nor with a panel open. LG's screen saver is left to its own timer: if it starts first, it covers
 * this, and the key that wakes it is LG's.
 */
var arteEl = document.getElementById('arte'), arteAttiva = false, ultimoTasto = Date.now(), arteFine = null, ultimoMouse = '';
function attivita() { ultimoTasto = Date.now(); }

function entraArte() {
  arteAttiva = true;
  clearTimeout(arteFine);
  arteEl.style.backgroundImage = 'url(' + sfondoMesso + ')';
  arteEl.className = 'kb' + (Math.random() < .5 ? 0 : 1);
  document.body.classList.add('arte');
}

function esciArte() {
  if (!arteAttiva) return;
  arteAttiva = false;
  document.body.classList.remove('arte');
  attivita();
  // The drift stops once the picture has faded out.
  clearTimeout(arteFine);
  arteFine = setTimeout(function () { if (!arteAttiva) arteEl.className = ''; }, 700);
}

// Another picture while the painting is alone: it fades out, and the new one comes in.
function cambiaArte(url) {
  arteEl.style.opacity = 0;
  setTimeout(function () { arteEl.style.backgroundImage = 'url(' + url + ')'; arteEl.style.opacity = ''; }, 2100);
}

['keydown', 'click', 'wheel'].forEach(function (nome) {
  document.addEventListener(nome, function (e) {
    if (arteAttiva) { esciArte(); e.preventDefault(); e.stopImmediatePropagation(); return; }
    attivita();
  }, true);
});
document.addEventListener('mousemove', function (e) {
  var dove = e.clientX + ',' + e.clientY;
  if (dove === ultimoMouse) return;
  ultimoMouse = dove;
  if (arteAttiva) esciArte(); else attivita();
}, true);
document.addEventListener('cursorStateChange', function () { esciArte(); attivita(); });
setInterval(function () {
  var minuti = typeof cfg.idleMinutes === 'number' ? cfg.idleMinutes : 0;
  if (!minuti || arteAttiva || document.hidden || !sfondoMesso || !pannello.hidden || !controllo.hidden || !albumi.hidden || !reglages.hidden) return;
  if (Date.now() - ultimoTasto >= minuti * 60000) entraArte();
}, 5000);

/*
 * The panel of controls: five headings, and under each what the TV offers. The sources and the pages of LG's
 * settings are opened as a tile opens an app; the sound output, the picture mode and the sleep timer are
 * read and set by the server, which only sends LG's settings service the fixed calls it has (see /api/control).
 * What the TV does not answer for is left out. Left and right change heading, up and down the choice, OK
 * applies it, Back closes.
 */
var controllo = document.getElementById('controllo');
var ctRighe = controllo.querySelector('.righe'), ctLista = controllo.querySelector('ul'), ctOnglet = controllo.querySelector('.onglets');
var ctDati = null, ctVoci = [], ctCat = 0, ctSel = [0, 0, 0, 0, 0], ctOcc = false;
controllo.onclick = function (e) { if (e.target === controllo) chiudiControllo(); };

function apriControllo(cat) {
  ctDati = null;
  ctCat = cat || 0;
  ctSel = [0, 0, 0, 0, 0];
  controllo.hidden = false;
  document.body.classList.add('pannello');
  disegnaControllo('loading');
  leggiControllo();
}

function chiudiControllo() {
  controllo.hidden = true;
  document.body.classList.remove('pannello');
  if (tornaReglages()) return;
  seleziona(ultimaVoce());
}

function leggiControllo(dopo) {
  var x = new XMLHttpRequest();
  x.open('GET', server() + '/api/control');
  x.timeout = 20000;
  x.onload = function () {
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) {}
    if (controllo.hidden) return;
    if (r && r.ok) ctDati = r;
    disegnaControllo(r && r.ok ? dopo : 'failed');
  };
  x.onerror = x.ontimeout = function () { if (!controllo.hidden) disegnaControllo('failed'); };
  x.send();
}

// The name of a choice: ours, or the TV's own word when we have none.
function nomeControllo(tipo, v) { return TEXT[tipo + '_' + v] || (v === 'off' ? TEXT.off : /^\d+$/.test(v) ? v + TEXT.min : v); }

// The headings and their choices, from what the TV answered; a heading with no choice is left out.
function vociControllo() {
  var d = ctDati || {}, out = [];
  var sorgenti = (d.inputs || []).map(function (i) {
    var t = tesseraDi(i.id) || {}, nome = t.title || i.title;
    return { label: nome + (i.connected === false ? TEXT.notConnected : ''), assente: i.connected === false,
      logo: logoDi({ id: i.id, title: nome, device: t.device, logo: t.logo }, 'logo', i.title),
      apri: function () { apri(i.id); chiudiControllo(); } };
  });
  out.push({ nome: TEXT.tabSources, voci: sorgenti });
  [['sound', TEXT.tabSound], ['picture', TEXT.tabPicture], ['sleep', TEXT.tabSleep]].forEach(function (c) {
    var dato = d[c[0]];
    out.push({ nome: c[1], voci: dato ? dato.options.map(function (v) {
      return { label: nomeControllo(c[0], v), segno: dato.current === v, imposta: (function (k, val) { return function () { impostaControllo(k, val); }; })(c[0], v) };
    }) : [] });
  });
  // LG's own pages, by the target its settings app takes.
  out.push({ nome: TEXT.tabLg, voci: [['network', TEXT.lgNetwork], ['Device', TEXT.lgDevice], ['picture', TEXT.lgPicture], ['sound', TEXT.lgSound]].map(function (p) {
    return { label: p[1], apri: function () { apri('com.palm.app.settings', { target: p[0] }); chiudiControllo(); } };
  }) });
  return out.filter(function (c) { return c.voci.length; });
}

function disegnaControllo(nota) {
  var cat = vociControllo();
  ctCat = Math.min(ctCat, Math.max(0, cat.length - 1));
  controllo.querySelector('h2').textContent = TEXT.control;
  ctOnglet.innerHTML = '';
  cat.forEach(function (c, i) {
    var a = document.createElement('a');
    a.textContent = c.nome;
    a.className = i === ctCat ? 'sel' : '';
    a.onclick = function () { ctCat = i; disegnaControllo(); };
    ctOnglet.appendChild(a);
  });
  ctLista.innerHTML = '';
  ctVoci = cat.length ? cat[ctCat].voci : [];
  ctVoci.forEach(function (v, i) {
    var li = document.createElement('li'), nome = document.createElement('span');
    if (v.logo) {
      var box = document.createElement('div');
      box.className = 'logo';
      box.appendChild(disegnaLogo(v.logo, 56, 130, 64));
      li.appendChild(box);
    }
    nome.textContent = v.label;
    li.appendChild(nome);
    if (v.segno) { var m = document.createElement('b'); m.textContent = '✓'; li.appendChild(m); }
    li.onmouseover = function () { selezionaControllo(i); };
    li.onclick = function () { ctSel[ctCat] = i; premiControllo(); };
    ctLista.appendChild(li);
  });
  // The one chosen now is where the choice starts, the first time a heading shows.
  if (ctSel[ctCat] === 0) for (var k = 0; k < ctVoci.length; k++) if (ctVoci[k].segno) ctSel[ctCat] = k;
  selezionaControllo(Math.min(ctSel[ctCat], Math.max(0, ctVoci.length - 1)));
  controllo.querySelector('p').textContent = nota === 'loading' ? TEXT.loading : nota === 'failed' ? TEXT.failed : TEXT.controlNote;
}

function selezionaControllo(i) {
  ctSel[ctCat] = i;
  for (var k = 0; k < ctLista.children.length; k++) ctLista.children[k].className = (k === i ? 'sel' : '') + (ctVoci[k].assente ? ' assente' : '');
  var li = ctLista.children[i];
  if (!li) return;
  if (li.offsetTop < ctRighe.scrollTop) ctRighe.scrollTop = li.offsetTop;
  if (li.offsetTop + li.offsetHeight > ctRighe.scrollTop + ctRighe.clientHeight) ctRighe.scrollTop = li.offsetTop + li.offsetHeight - ctRighe.clientHeight;
}

function premiControllo() {
  var v = ctVoci[ctSel[ctCat]];
  if (!v) return;
  if (v.apri) return v.apri();
  if (v.imposta) v.imposta();
}

// One change of the sound output, the picture mode or the sleep timer; the TV is read again for what it did.
function impostaControllo(nome, valore) {
  if (ctOcc) return;
  ctOcc = true;
  var x = new XMLHttpRequest(), corpo = {};
  corpo[nome] = valore;
  x.open('POST', server() + '/api/control');
  x.setRequestHeader('Content-Type', 'application/json');
  x.timeout = 15000;
  x.onload = x.onerror = x.ontimeout = function () {
    ctOcc = false;
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) {}
    if (controllo.hidden) return;
    if (r && r.ok) leggiControllo(); else disegnaControllo('failed');
  };
  x.send(JSON.stringify(corpo));
}

function tastoControllo(e) {
  var n = vociControllo().length;
  if (e.keyCode === 37) { ctCat = (ctCat + n - 1) % n; disegnaControllo(); }
  else if (e.keyCode === 39) { ctCat = (ctCat + 1) % n; disegnaControllo(); }
  else if (e.keyCode === 38) selezionaControllo(Math.max(0, ctSel[ctCat] - 1));
  else if (e.keyCode === 40) selezionaControllo(Math.min(ctVoci.length - 1, ctSel[ctCat] + 1));
  else if (e.keyCode === 13) premiControllo();
  else if (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8) chiudiControllo();
  else return;
  e.preventDefault();
}

/*
 * The Magic Remote's pointer: webOS raises cursorStateChange, with detail.visibility,
 * when it shows or hides (LG's System UI Visibility guide, webOS 2 on); a moving
 * pointer also sends mousemove. A pointer on a tile only selects it, so a row wider
 * than the screen gets arrows at its ends while the pointer shows: a click slides it
 * by most of a screen, and so does resting on an arrow, every 0.6 s; the wheel too.
 */
var puntatore = false, frSx = document.getElementById('fr-sx'), frDx = document.getElementById('fr-dx');
var giro = null, rotella = 0;
// Phosphor Icons' carets, light weight (MIT).
frSx.innerHTML = '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M164.24,203.76a6,6,0,1,1-8.48,8.48l-80-80a6,6,0,0,1,0-8.48l80-80a6,6,0,0,1,8.48,8.48L88.49,128Z"/></svg>';
frDx.innerHTML = '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M180.24,132.24l-80,80a6,6,0,0,1-8.48-8.48L167.51,128,91.76,52.24a6,6,0,0,1,8.48-8.48l80,80A6,6,0,0,1,180.24,132.24Z"/></svg>';

function conPuntatore(on) {
  if (on === puntatore) return;
  puntatore = on;
  if (on) document.body.classList.add('puntatore');
  else { document.body.classList.remove('puntatore'); clearTimeout(giro); }
  frecce();
}
// How far the row can slide, and the arrows where it can.
function margine() { return Math.max(0, posti().width - (1920 - 224)); }
function frecce() {
  frSx.style.height = frDx.style.height = posti().height + 'px';
  frSx.className = 'freccia' + (spostamento > 0 ? ' su' : '');
  frDx.className = 'freccia' + (spostamento < margine() ? ' su' : '');
}
function scorri(dir) {
  var prima = spostamento;
  spostamento = Math.max(0, Math.min(margine(), spostamento + dir * (1920 - 224 - 240)));
  if (spostamento === prima) return clearTimeout(giro);
  nav.style.webkitTransform = nav.style.transform = 'translateX(' + -spostamento + 'px)';
  caricaVisibili();
  frecce();
}
[[frSx, -1], [frDx, 1]].forEach(function (f) {
  f[0].onclick = function () { scorri(f[1]); };
  f[0].onmouseover = function () {
    clearTimeout(giro);
    giro = setTimeout(function ancora() { scorri(f[1]); giro = setTimeout(ancora, 600); }, 600);
  };
  f[0].onmouseout = function () { clearTimeout(giro); };
});
document.addEventListener('cursorStateChange', function (e) { conPuntatore(!!(e.detail && e.detail.visibility)); });
document.addEventListener('mousemove', function () { conPuntatore(true); });
// One step for each turn of the wheel, however many events it sends.
document.addEventListener('wheel', function (e) {
  if (!pannello.hidden || Date.now() - rotella < 250) return;
  rotella = Date.now();
  scorri(e.deltaY > 0 || e.deltaX > 0 ? 1 : -1);
});

// The weather icons, from Open-Meteo's WMO codes. Not ICONE, which is logos.js's.
var NUVOLA_ALTA = '<path d="M6.5 15h11a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.3 8.1 3.5 3.5 0 0 0 6.5 15z"/>';
var METEO = {
  sole: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  luna: '<path d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6z"/>',
  nuvola: '<path d="M6.5 18h11a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.3 11.1 3.5 3.5 0 0 0 6.5 18z"/>',
  nebbia: '<path d="M4 9h16M6 13h12M4 17h16"/>',
  pioggia: NUVOLA_ALTA + '<path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/>',
  neve: NUVOLA_ALTA + '<path d="M8 19.5h.01M12 19.5h.01M16 19.5h.01" stroke-width="2.4"/>',
  temporale: NUVOLA_ALTA + '<path d="M12.5 16l-2 3h3l-2 3"/>'
};

function icona(codice, giorno) {
  var nome = codice <= 1 ? (giorno ? 'sole' : 'luna') : codice <= 3 ? 'nuvola' : codice <= 48 ? 'nebbia' :
    codice >= 95 ? 'temporale' : (codice >= 71 && codice <= 77) || codice === 85 || codice === 86 ? 'neve' : 'pioggia';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    METEO[nome] + '</svg>';
}

function meteo() {
  var w = cfg.weather;
  meteoPer = w ? w.lat + ',' + w.lon + ',' + cfg.units : '';
  meteoAlle = Date.now();
  if (!w) { meteoEl.innerHTML = ''; return; }
  meteoEl.textContent = w.name;
  var x = new XMLHttpRequest();
  x.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon +
    '&current=temperature_2m,weather_code,is_day&timezone=auto' + (cfg.units === 'f' ? '&temperature_unit=fahrenheit' : ''));
  x.timeout = 8000;
  x.onload = function () {
    try {
      var c = JSON.parse(x.responseText).current;
      meteoEl.textContent = w.name + ' · ' + Math.round(c.temperature_2m) + '°';
      meteoEl.insertAdjacentHTML('beforeend', icona(c.weather_code, c.is_day));
    } catch (e) {}
  };
  x.send();
}

var oraMostrata = ''; // the time and the style drawn, so the same minute is not drawn again
function aggiorna() {
  var d = new Date(), h = d.getHours(), m = (d.getMinutes() < 10 ? ':0' : ':') + d.getMinutes();
  var qui = cfg.clock + ' ' + cfg.clockStyle + ' ' + h + m;
  if (qui !== oraMostrata) {
    oraMostrata = qui;
    if (cfg.clock === '12') ora.innerHTML = ((h + 11) % 12 + 1) + m + '<small>' + (h < 12 ? 'AM' : 'PM') + '</small>';
    else ora.textContent = h + m;
    ora.style.marginLeft = rientroOra(cfg.clockStyle, ora.textContent);
  }
  var per = cfg.weather ? cfg.weather.lat + ',' + cfg.weather.lon + ',' + cfg.units : '';
  if (per !== meteoPer || Date.now() - meteoAlle > 15 * 60000) meteo();
}

/*
 * The clock, the weather and the slot of the background, on each new minute of the TV's clock, and not at all
 * while an app is in front (the Home is hidden then): it starts again when the Home comes back.
 */
var battitoTimer = null;
function battito() {
  clearTimeout(battitoTimer);
  if (document.hidden) return;
  aggiorna();
  fondoDellOra();
  preparaProssimi();
  var d = new Date();
  battitoTimer = setTimeout(battito, 60000 - d.getSeconds() * 1000 - d.getMilliseconds() + 50);
}

/*
 * The config comes from the server on this TV, and is kept here so the Home
 * shows at once at power on, before the server is up. cb(answered).
 */
function leggi(cb) {
  var x = new XMLHttpRequest();
  x.open('GET', server() + '/api/config');
  x.timeout = 3000;
  x.onload = function () {
    var c = null;
    try { c = JSON.parse(x.responseText); } catch (e) {}
    if (!c || !c.version) return cb && cb(null);
    letto = true;
    if (c.port && c.port !== porta) {
      porta = c.port;
      try { localStorage.setItem('port', String(porta)); } catch (e) {}
    }
    var j = JSON.stringify(c);
    if (j !== shown) {
      shown = j;
      cfg = c;
      try { localStorage.setItem('config', j); } catch (e) {}
      disegna();
      chiediAperte(); // the button may have been turned on or off
    }
    if (cb) cb(c);
  };
  x.onerror = x.ontimeout = function () { if (cb) cb(null); };
  x.send();
}

/*
 * When the server does not answer, or answers with an older version, the
 * Homebrew Channel, which runs as root, is asked to put it in place: once per
 * launch, as the server may simply not have started yet after a cold boot.
 */
var setupFatto = false;
function setup() {
  if (setupFatto || !window.PalmServiceBridge) return;
  setupFatto = true;
  luna(EXEC, { command: 'sh "' + APP_DIR + '/service/setup.sh"' }, function () { leggi(); });
}

function controlla(prove) {
  leggi(function (c) {
    if (c && c.version === APP_VERSION) return;
    if (c) return setup();
    if (prove > 1) return setTimeout(function () { controlla(prove - 1); }, 1500);
    trovaPorta(function (nuova) { if (nuova) controlla(2); else setup(); });
  });
}

/*
 * The port the server wrote it is on, asked of the Homebrew Channel when the
 * server does not answer where it was: moved while the Home was hidden, or on
 * another port at start because a different program had this one. cb(moved).
 */
var cercata = 0;
function trovaPorta(cb) {
  if (!window.PalmServiceBridge || Date.now() - cercata < 30000) return cb(false);
  cercata = Date.now();
  luna(EXEC, { command: 'cat /tmp/lightkeeper.port' }, function (r) {
    var p = parseInt(r && r.stdoutString, 10);
    if (!(p > 0) || p === porta) return cb(false);
    porta = p;
    try { localStorage.setItem('port', String(p)); } catch (e) {}
    cb(true);
  });
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { clearTimeout(battitoTimer); pannello.hidden = true; controllo.hidden = true; albumi.hidden = true; reglages.hidden = true; document.body.classList.remove('pannello'); esciArte(); }
  else { attivita(); battito(); leggi(); chiediAperte(); }
});

// Home key with the app already open: with handlesRelaunch it comes to the front only if it asks.
// With a random background, the TV may have just come on: the server is asked first,
// and the new picture loaded, so the last one does not show; 400 ms at most.
document.addEventListener('webOSRelaunch', function () {
  var fatto = false;
  function mostra() {
    if (fatto) return;
    fatto = true;
    if (sistema) sistema.activate();
    esciArte();
    attivita();
    pannello.hidden = true;
    controllo.hidden = true;
    albumi.hidden = true;
    reglages.hidden = true;
    document.body.classList.remove('pannello');
    seleziona(iniziale());
    aggiorna();
    fondoDellOra();
    chiediAperte();
  }
  if (!cfg.randomBackground) { mostra(); return leggi(); }
  setTimeout(mostra, 400);
  leggi(function () {
    (function attendi() { if (!sfondoChiesto) return mostra(); setTimeout(attendi, 30); })();
  });
});

disegna();
controlla(5);
chiediAperte();
battito();
// Changes made on a phone show within seconds; nothing is asked while hidden.
var mancate = 0;
setInterval(function () {
  if (document.hidden) return;
  leggi(function (c) {
    mancate = c ? 0 : mancate + 1;
    if (c && !aperteLette) chiediAperte(); // the server was not up yet when the Home first asked
    if (mancate >= 3) trovaPorta(function (nuova) { if (nuova) leggi(); });
  });
}, 4000);
</script>
<script src="reglages.js"></script>
